[project]
name = "mtg"
version = "1.0.0"
description = "MTG - mind the gap: document-aware course review system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=1.16",
    "pymupdf>=1.24",
    "openai>=1.40",
    "itsdangerous>=2.2",
    "bcrypt>=4.1",
    "pydantic-settings>=2.4",
    "cel-python>=0.2",
    "pgvector>=0.3",
    "markdown>=3.6",
    "reportlab>=4.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
